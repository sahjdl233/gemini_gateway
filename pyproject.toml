[project]
name = "gemini-gateway"
version = "0.1.0"
description = "OpenAI-compatible Gemini Gateway with multiple Provider integrations (fake / anonymous_vertex / firebase / gemini_cli / antigravity)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  # CONFIG/R-7: the legacy write sink is deprecated; its warning is
  # contract-verified in tests/app/test_persistence_wiring.py via
  # pytest.warns (which catches it regardless of this filter).
  "ignore:PostgreSQLResourceRepository is deprecated:DeprecationWarning",
]
